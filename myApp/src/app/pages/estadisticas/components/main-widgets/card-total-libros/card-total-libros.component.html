<ion-card class="stats-widget dashboard-widget">
  <ion-card-header>
    <ion-card-title>
      <div class="title">{{totalLibros | number}}</div>
      <div class="subtitle">Total de libros</div>
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-grid class="total-libros" [fixed]="true">
      
        <ion-row *ngFor="let item of totalLibrosObj">
          <ion-col size="2">
            <ion-text>{{item.EscolaridadLibro}}</ion-text>
          </ion-col>
          <ion-col size="1">
            <ion-text>{{item.Cantidad | number}}</ion-text>
          </ion-col>
        </ion-row>
      
    </ion-grid>
  </ion-card-content>

  <div class="footer">
    <div class="btns-container">
      <btn-exportar></btn-exportar>
      <btn-ver-mas (click)="EstadisticasPage.navigateToRoute('elegir-campus/libros')"></btn-ver-mas>
    </div>
  </div>
</ion-card>
