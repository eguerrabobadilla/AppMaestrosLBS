<ion-button (click)="presentPopover($event)" slot="start" class="stats-btn purple-btn" aria-label="Favorite" shape="round" size="size">
    <ion-icon slot="end" name="exit-outline" aria-hidden="true" style="transform: rotate(270deg); margin-left: 1vw;"></ion-icon>
    Exportar
</ion-button>
<ion-popover #popover [isOpen]="isOpen" (didDismiss)="isOpen = false" side="bottom" alignment="center" size="cover" show-backdrop="false">
    <ng-template>
      <ion-content class="popover-container">
        <ion-list lines="none">
            <ion-item class="popover-item" [button]="true" [detail]="false" aria-label="Excel" lines="none" (click)="excelClicked($event)">
                <ion-icon class="icon" slot="start" aria-hidden="true" src="./assets/icon/EXCEL_file_icon.svg"></ion-icon>
                <ion-label class="popover-label">Archivo Excel</ion-label>
            </ion-item>
            <ion-item class="popover-item" [button]="true" [detail]="false" aria-label="Pdf" lines="none" (click)="pdfClicked($event)">
                <ion-icon class="icon" slot="start" aria-hidden="true" src="./assets/icon/PDF_file_icon.svg"></ion-icon>
                <ion-label class="popover-label">Archivo PDF</ion-label>
            </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
</ion-popover>
